name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Git tag to rollback to'
        required: true
        default: 'golden-build-v1'
      reason:
        description: 'Reason'
        required: false
        default: 'emergency rollback'

permissions:
  contents: write

jobs:
  rollback:
    name: Restore frontend to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Fetch all tags
        run: git fetch --tags

      - name: Verify tag exists
        run: |
          if ! git tag | grep -q "^${{ github.event.inputs.target_tag }}$"; then
            echo "ERROR: Tag '${{ github.event.inputs.target_tag }}' not found."
            echo "Available tags:"
            git tag
            exit 1
          fi
          git log ${{ github.event.inputs.target_tag }} -1 --format="Restoring: %H (%ad) %s" --date=short

      - name: Restore files from tag
        run: git checkout ${{ github.event.inputs.target_tag }} -- .

      - name: Commit and push rollback
        run: |
          git config user.email "plannitadmin@gmail.com"
          git config user.name "plannitadmin [rollback]"
          git add -A
          if git diff --cached --quiet; then
            echo "Already at this version. Nothing to commit."
            exit 0
          fi
          git commit -m "rollback: restore ${{ github.event.inputs.target_tag }} — ${{ github.event.inputs.reason }}"
          git push origin main
          echo "Frontend rollback pushed. Vercel deploys in ~60 seconds."
