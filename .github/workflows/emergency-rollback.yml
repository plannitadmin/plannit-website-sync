name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Git tag to rollback to'
        required: true
        default: 'golden-build-v1'
      reason:
        description: 'Reason'
        required: false
        default: 'emergency rollback'

permissions:
  contents: write

jobs:
  rollback:
    name: Restore frontend to production
    runs-on: ubuntu-latest
    steps:
      - name: Clone, restore tag, and push
        run: |
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git repo
          cd repo
          git fetch --tags
          if ! git tag | grep -q "^${{ github.event.inputs.target_tag }}$"; then
            echo "ERROR: Tag not found. Available:"
            git tag
            exit 1
          fi
          git log ${{ github.event.inputs.target_tag }} -1 --format="Restoring: %H %s" --date=short
          git checkout ${{ github.event.inputs.target_tag }} -- .
          git config user.email "plannitadmin@gmail.com"
          git config user.name "plannitadmin [rollback]"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          git add -A
          if git diff --cached --quiet; then
            echo "Already at this version. Nothing to commit."
            exit 0
          fi
          git commit -m "rollback: restore ${{ github.event.inputs.target_tag }} — ${{ github.event.inputs.reason }}"
          git push origin main
          echo "Done. Vercel deploys in ~60 seconds."
